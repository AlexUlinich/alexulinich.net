  <title>Alex Ulinich</title>
  <meta name="description" content="Writing by Alex Ulinich.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --paper: #000;
      --ink: #fcfcfc;
      --ink-soft: #e4e4e4;
      --muted: #a3a3a3;
      color-scheme: dark;
    }

    ::selection { background: var(--ink); color: var(--paper); }

    html { background: var(--paper); }

    body {
      max-width: 680px;
      margin-left: clamp(0px, calc(10vw - 48px), 110px);
      padding: clamp(28px, 8vh, 72px) 20px;
      background: var(--paper);
      color: var(--ink-soft);
      font-family: "Times New Roman", Times, serif;
      font-size: 18px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    h1 { font-size: 30px; font-weight: bold; line-height: 1.2; color: var(--ink); }

    .contact { margin-top: 8px; font-size: 16px; line-height: 1.5; }
    .obf { color: var(--muted); }

    /* The hand-drawn rule, traced from the original sketch */
    .rule {
      display: block;
      width: 100%;
      aspect-ratio: 303.5 / 4.12;
      min-height: 7px;
      margin: 16px 0 22px;
      fill: var(--ink);
    }

    .posts { list-style: none; color: var(--muted); }
    .posts li { margin-bottom: 0.4em; }

    a { color: var(--ink); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    a:focus-visible { outline: 1px dashed var(--ink); outline-offset: 4px; }
  </style>
</head>
